[package]
name = "gbem"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gb-core = { path = "../gb-core" }
eframe = { version = "0.32", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
# eframe with default-features off pulls wgpu without any backend enabled;
# this direct dep re-enables the default per-platform backends (Metal etc).
wgpu = "25"
cpal = "0.15"
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
rfd = "0.17"
pollster = "0.4"
